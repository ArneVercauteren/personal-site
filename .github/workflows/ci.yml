name: CI

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            paper_trading/requirements.txt
            paper_trading/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r paper_trading/requirements-dev.txt

      - name: Compile Python modules
        run: python -m compileall -q paper_trading

      - name: Run paper-trading tests and data checks
        run: pytest paper_trading/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
