name: CI

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper-trading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            paper_trading/requirements-lock.txt

      - name: Install dependencies
        run: pip install -r paper_trading/requirements-lock.txt

      - name: Compile Python modules
        run: python -m compileall -q paper_trading

      - name: Run paper-trading tests and data checks
        run: pytest paper_trading/tests -q

      - name: Validate committed public snapshot and ledger
        run: python -m paper_trading.validate_data

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Static accessibility and content smoke checks
        run: npm run test:static

      - name: Install browser for accessibility checks
        run: npx playwright install --with-deps chromium

      - name: Rendered accessibility and layout checks
        run: npm run test:a11y
