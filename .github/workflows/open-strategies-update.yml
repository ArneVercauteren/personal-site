name: Open strategies — paper-trading update

# Tier 2b: runs the OPEN-strategy updater on a schedule, commits the refreshed
# public/data/*.json, and lets Vercel redeploy. Secured strategies have their
# own crons in the private repo — this job only touches open data.
# See docs/subsystems/scheduled-job.md.

on:
  schedule:
    # A few times a day on weekdays (UTC), after US market hours.
    - cron: "30 22 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

# Never let two updater runs commit on top of each other.
concurrency:
  group: open-strategies-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r paper_trading/requirements.txt

      - name: Regenerate open-strategy data
        run: python -m paper_trading.update

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/portfolio.json public/data/trades.json public/data/strategies.json
          if git diff --staged --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "data: refresh open-strategy paper portfolio [skip ci]"
            git push
          fi
