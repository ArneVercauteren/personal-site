name: Open strategies — paper-trading update

# Tier 2b: runs the OPEN-strategy updater on a schedule, commits the refreshed
# public/data/*.json, and lets Vercel redeploy. Secured strategies have their
# own crons in the private repo — this job only touches open data.
# See docs/subsystems/scheduled-job.md.

on:
  schedule:
    # Once on weekdays after the regular US session and normal data finalization.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

# Never let two updater runs commit on top of each other.
concurrency:
  group: paper-data-writer-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r paper_trading/requirements-lock.txt

      - name: Regenerate open-strategy data
        id: regenerate
        run: |
          for attempt in 1 2 3; do
            python -m paper_trading.update && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done

      - name: Preserve failed updater state for review
        if: steps.regenerate.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paper-update-failure-${{ github.run_id }}
          path: |
            paper_ledger/
            paper_state/
          if-no-files-found: error
          retention-days: 14

      - name: Validate generated state and publication
        run: |
          pytest paper_trading/tests -q
          python -m paper_trading.validate_data --max-age-days 4

      - name: Commit refreshed data (if changed)
        run: |
          git config user.name "paper-trading-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data paper_state paper_ledger paper_migration
          if git diff --staged --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "data: refresh open-strategy paper portfolio [skip ci]"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
