name: Paper data — stale snapshot alert

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            paper_trading/requirements-lock.txt

      # validate_data imports paper_trading.conformance, which needs pandas —
      # without this the job dies on ImportError and a genuinely stale snapshot
      # is indistinguishable from a broken runner.
      - name: Install dependencies
        run: pip install -r paper_trading/requirements-lock.txt

      - name: Fail visibly when the last good snapshot is stale
        run: python -m paper_trading.validate_data --max-age-days 4
